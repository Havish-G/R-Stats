<svg width="680" height="630" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architecture of the Statistical Analysis Studio Shiny application</title>
<desc>A layered architecture diagram showing an analyst's browser connecting to a Shiny UI layer with a Data tab, five analysis tabs (EDA, Hypothesis Testing, ANOVA, Regression, CLT Lab), and an Analysis History tab. The UI layer calls an R logic layer of three scripts: db_connect.R, stats_engine.R, and report_generate.R. The logic layer reads and writes a SQLite/PostgreSQL database, saved analyses, and generates downloadable HTML reports. The whole application is packaged as one deployable unit via Docker, shinyapps.io, or Posit Connect.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1a1a1a; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; fill: #5f5e5a; }
  .box { fill: #f7f6f2; stroke: #888780; }
  .purple { fill: #EEEDFE; stroke: #534AB7; }
  .purple text.th { fill: #26215C; }
  .purple text.ts { fill: #3C3489; }
  .teal { fill: #E1F5EE; stroke: #0F6E56; }
  .teal text.th { fill: #04342C; }
  .teal text.ts { fill: #085041; }
  .coral { fill: #FAECE7; stroke: #993C1D; }
  .coral text.th { fill: #4A1B0C; }
  .coral text.ts { fill: #712B13; }
  .arr { stroke: #5f5e5a; stroke-width: 1; fill: none; }
  .dashed { stroke: #888780; stroke-width: 1; stroke-dasharray: 6 4; fill: none; opacity: 0.6; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="20" y="100" width="640" height="476" rx="16" class="dashed"/>

<g>
<rect x="240" y="20" width="200" height="44" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Analyst / browser</text>
</g>
<line x1="340" y1="64" x2="340" y2="120" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="120" width="600" height="140" rx="20" class="box" stroke-width="0.5"/>
<text class="th" x="60" y="145">Shiny UI layer (app.R)</text>

<g class="purple">
<rect x="60" y="164" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="145" y="182" text-anchor="middle" dominant-baseline="central">Data</text>
<text class="ts" x="145" y="202" text-anchor="middle" dominant-baseline="central">Pick or upload CSV</text>
</g>

<g class="purple">
<rect x="255" y="164" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="182" text-anchor="middle" dominant-baseline="central">Analysis tabs (5)</text>
<text class="ts" x="340" y="202" text-anchor="middle" dominant-baseline="central">EDA, tests, ANOVA...</text>
</g>

<g class="purple">
<rect x="450" y="164" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="535" y="182" text-anchor="middle" dominant-baseline="central">History</text>
<text class="ts" x="535" y="202" text-anchor="middle" dominant-baseline="central">Saved runs, audit log</text>
</g>

<line x1="340" y1="260" x2="340" y2="310" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="310" width="600" height="140" rx="20" class="box" stroke-width="0.5"/>
<text class="th" x="60" y="335">R logic layer</text>

<g class="teal">
<rect x="60" y="354" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="145" y="372" text-anchor="middle" dominant-baseline="central">db_connect.R</text>
<text class="ts" x="145" y="392" text-anchor="middle" dominant-baseline="central">DB + audit helpers</text>
</g>

<g class="teal">
<rect x="255" y="354" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="372" text-anchor="middle" dominant-baseline="central">stats_engine.R</text>
<text class="ts" x="340" y="392" text-anchor="middle" dominant-baseline="central">Tests, ANOVA, lm, CLT</text>
</g>

<g class="teal">
<rect x="450" y="354" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="535" y="372" text-anchor="middle" dominant-baseline="central">report_generate.R</text>
<text class="ts" x="535" y="392" text-anchor="middle" dominant-baseline="central">Renders Rmd report</text>
</g>

<line x1="340" y1="450" x2="340" y2="475" class="arr"/>
<line x1="145" y1="475" x2="535" y2="475" class="arr"/>
<line x1="145" y1="475" x2="145" y2="500" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="475" x2="340" y2="500" class="arr" marker-end="url(#arrow)"/>
<line x1="535" y1="475" x2="535" y2="500" class="arr" marker-end="url(#arrow)"/>

<g class="coral">
<rect x="60" y="500" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="145" y="518" text-anchor="middle" dominant-baseline="central">SQLite / Postgres</text>
<text class="ts" x="145" y="538" text-anchor="middle" dominant-baseline="central">Relational tables</text>
</g>

<g class="coral">
<rect x="255" y="500" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="518" text-anchor="middle" dominant-baseline="central">Saved analyses</text>
<text class="ts" x="340" y="538" text-anchor="middle" dominant-baseline="central">Params, results, p-vals</text>
</g>

<g class="coral">
<rect x="450" y="500" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="535" y="518" text-anchor="middle" dominant-baseline="central">Analysis report</text>
<text class="ts" x="535" y="538" text-anchor="middle" dominant-baseline="central">Downloadable HTML</text>
</g>

<text class="ts" x="340" y="600" text-anchor="middle">Dashed border = one deployable unit (Docker, shinyapps.io, or Posit Connect)</text>
</svg>
